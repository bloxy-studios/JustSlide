[workspace]
resolver = "3"
members = ["crates/justslide-protocol", "crates/justslide-core", "crates/justslide-mcp", "crates/justslide-ffi"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
rand = "0.9"
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "net", "time", "sync", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
